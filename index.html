<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Loyihasi - Filter va Qidiruv</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #1a1a1a;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        button {
            padding: 10px 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .filters {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            background-color: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: #4a90e2;
            color: white;
        }

        ul {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        li.completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            word-break: break-all;
        }

        .delete-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .empty-message {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Uyga Vazifa: Todo</h1>

        <!-- Qidirish inputi -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Vazifalarni qidirish...">
        </div>

        <!-- Yangi vazifa qo'shish -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Yangi vazifa kiriting...">
            <button id="addBtn">Qo'shish</button>
        </div>

        <!-- Filter tugmalari (all / active / done) -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Barchasi</button>
            <button class="filter-btn" data-filter="active">Bajarilmagan</button>
            <button class="filter-btn" data-filter="done">Bajarilgan</button>
        </div>

        <!-- Vazifalar ro'yxati -->
        <ul id="taskList"></ul>
        <div id="emptyMessage" class="empty-message" style="display: none;">Vazifalar topilmadi</div>
    </div>

    <!-- JavaScript faylini ulash -->
    <script src="script.js"></script>
</body>
</html>
